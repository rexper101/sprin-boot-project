<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Employee' : 'Add Employee'">Employee form</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --primary: #4f46e5;
            --text: #172033;
            --muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        a { text-decoration: none; }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.9);
            padding: 18px 36px;
            border-bottom: 1px solid var(--border);
        }
        .brand { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        .nav { display: flex; gap: 22px; }
        .nav a { color: var(--muted); font-weight: 700; }
        .nav a.active { color: var(--primary); }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px 60px;
        }
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 28px;
        }
        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }
        form {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 20px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .field.full {
            grid-column: 1 / -1;
        }
        label {
            font-weight: 700;
            color: var(--muted);
        }
        input, select {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.9rem 1rem;
            font-size: 1rem;
        }
        .button-row {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 18px;
        }
        .button {
            border: none;
            border-radius: 10px;
            padding: 0.9rem 1.3rem;
            font-weight: 700;
            cursor: pointer;
        }
        .button.primary { background: var(--primary); color: white; }
        .button.secondary { background: #eef2ff; color: var(--primary); }
        .error {
            color: var(--danger);
            font-size: 0.8rem;
            margin: 0;
        }
        @media (max-width: 640px) {
            form { grid-template-columns: 1fr; }
            .nav { display: none; }
            .topbar { padding: 16px 18px; }
            .page-head { display: block; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">EmployeeHub</div>
        <nav class="nav">
            <a th:href="@{/dashboard}">Dashboard</a>
            <a class="active" th:href="@{/employees}">Employees</a>
        </nav>
        <a class="button primary" th:href="@{/employees/new}">+ Add Employee</a>
    </header>

    <main class="container">
        <div class="panel">
            <div class="page-head">
                <h1 th:text="${isEdit} ? 'Edit Employee' : 'Add Employee'">Add Employee</h1>
                <a class="button secondary" th:href="@{/employees}">Back to list</a>
            </div>

            <form th:action="${isEdit} ? @{/employees/{id}/edit(id=${employee.id})} : @{/employees}"
                  th:object="${employee}"
                  method="post">

                <div class="field">
                    <label for="firstName">First Name</label>
                    <input id="firstName" type="text" th:field="*{firstName}" />
                    <p class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
                </div>

                <div class="field">
                    <label for="lastName">Last Name</label>
                    <input id="lastName" type="text" th:field="*{lastName}" />
                    <p class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
                </div>

                <div class="field full">
                    <label for="email">Email</label>
                    <input id="email" type="email" th:field="*{email}" />
                    <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <div class="field">
                    <label for="department">Department</label>
                    <input id="department" type="text" th:field="*{department}" />
                    <p class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></p>
                </div>

                <div class="field">
                    <label for="designation">Designation</label>
                    <input id="designation" type="text" th:field="*{designation}" />
                    <p class="error" th:if="${#fields.hasErrors('designation')}" th:errors="*{designation}"></p>
                </div>

                <div class="field">
                    <label for="salary">Salary</label>
                    <input id="salary" type="number" step="0.01" th:field="*{salary}" />
                    <p class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></p>
                </div>

                <div class="field">
                    <label for="phone">Phone</label>
                    <input id="phone" type="text" th:field="*{phone}" />
                    <p class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                </div>

                <div class="field">
                    <label for="dateOfBirth">Date of Birth</label>
                    <input id="dateOfBirth" type="date" th:field="*{dateOfBirth}" />
                    <p class="error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></p>
                </div>

                <div class="field">
                    <label for="dateOfJoining">Date of Joining</label>
                    <input id="dateOfJoining" type="date" th:field="*{dateOfJoining}" />
                    <p class="error" th:if="${#fields.hasErrors('dateOfJoining')}" th:errors="*{dateOfJoining}"></p>
                </div>

                <div class="field full">
                    <label for="active">Status</label>
                    <select id="active" th:field="*{active}">
                        <option th:value="true" th:text="'Active'">Active</option>
                        <option th:value="false" th:text="'Inactive'">Inactive</option>
                    </select>
                </div>

                <div class="button-row">
                    <a class="button secondary" th:href="@{/employees}">Cancel</a>
                    <button class="button primary" type="submit" th:text="${isEdit} ? 'Update Employee' : 'Save Employee'">Save Employee</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
