<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmployeeHub Login</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --primary: #4f46e5;
            --primary-dark: #312e81;
            --text: #0f172a;
            --muted: #475569;
            --border: #e2e8f0;
            --shadow: 0 18px 50px rgba(79, 70, 229, 0.15);
            --danger: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
            color: var(--text);
        }
        .login-card {
            width: min(420px, calc(100% - 32px));
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 32px 28px;
        }
        .brand {
            text-align: center;
            margin-bottom: 20px;
        }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.9rem;
        }
        .subtitle {
            margin: 0 0 24px;
            color: var(--muted);
            text-align: center;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--muted);
        }
        input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
        }
        .login-button {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 0.9rem 1rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        .credentials {
            margin-top: 18px;
            background: #eef2ff;
            color: var(--muted);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .alert {
            margin-bottom: 18px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--danger);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-badge">EH</div>
            <h1>EmployeeHub</h1>
        </div>
        <p class="subtitle">Sign in to access the employee management dashboard.</p>

        <div class="alert" th:if="${param.error}">Invalid username or password.</div>
        <div class="alert" th:if="${param.logout}">You have been logged out successfully.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter password" required>
            </div>

            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="login-button" type="submit">Sign In</button>
        </form>

        <div class="credentials">
            Demo credentials:<br>
            <strong>Admin:</strong> admin / admin123<br>
            <strong>User:</strong> user / user123
        </div>
    </div>
</body>
</html>
